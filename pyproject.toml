[project]
name = "ffb"
version = "0.1.0"
description = "NFL data analytics and fantasy football tools (ffb)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "nfl-data-py>=0.3.0",
    "polars>=1.0",
    "pyarrow>=23.0.1",
    "textual>=3.0",
]

[project.scripts]
ffb = "ffb.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffb"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.uv]
constraint-dependencies = ["pandas>=2.0"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM117"]  # nested with statements are idiomatic in Textual compose()

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_unimported = true
disallow_redefinition_new = true
disallow_untyped_globals = true
local_partial_types = true
strict_bytes = true
warn_unreachable = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "ignore-without-code",
    "narrowed-type-not-subtype",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--showlocals"]

[tool.coverage.run]
source = ["src/ffb"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Floor set from the measured total. `uv run pytest --cov` enforces it; a plain
# `uv run pytest` collects no coverage and so does not.
fail_under = 87
exclude_also = [
    "raise NotImplementedError",
]
